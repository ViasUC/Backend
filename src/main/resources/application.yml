# src/main/resources/application.yml
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://34.95.213.224:5432/postgres   # <- host:puerto/base
    username: postgres
    password: 'UniversidadCatolica2025*'                 # <- comillas por el *
    hikari:
      pool-name: HikariPool-postgres
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 20000
      keepalive-time: 300000
  jpa:
    hibernate:
      ddl-auto: validate    # valida que las tablas ya existen, no las toca
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql     # opcional (por defecto ya es /graphiql)
